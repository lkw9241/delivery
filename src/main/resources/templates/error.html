<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오류 발생</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .error-card {
            background: white;
            border-radius: 12px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.10);
        }

        .error-icon { font-size: 56px; margin-bottom: 16px; }

        .error-status {
            font-size: 48px;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 8px;
        }

        .error-code {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
            font-family: monospace;
        }

        .error-message {
            font-size: 16px;
            color: #444;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-back {
            display: inline-block;
            padding: 12px 28px;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-back:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-icon">⚠️</div>

    <div class="error-status" th:text="${errorStatus} ?: '오류'"></div>

    <div class="error-code"
         th:text="${errorCode} != null ? '[' + ${errorCode} + ']' : ''"></div>

    <div class="error-message"
         th:text="${errorMessage} ?: '알 수 없는 오류가 발생했습니다.'"></div>

    <a href="/dashboard" class="btn-back">← 대시보드로 돌아가기</a>
</div>

</body>
</html>
