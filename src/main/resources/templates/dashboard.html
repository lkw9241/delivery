<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>납기 모니터링 대시보드</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f7f9fc;
        }

        /* ── 헤더 ── */
        .top-bar {
            background-color: #2c3e50;
            color: white;
            padding: 14px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar h1 { font-size: 20px; margin: 0; }

        /* ── 상단 네비 링크 ── */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #bdc3c7;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
        }

        .nav-links a:hover {
            background-color: rgba(255,255,255,0.12);
            color: white;
        }

        /* ── 알림 벨 ── */
        .bell-wrapper { position: relative; cursor: pointer; }

        .bell-icon { font-size: 22px; }

        .bell-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            min-width: 18px;
            height: 18px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        /* ── 알림 드롭다운 패널 ── */
        .notification-panel {
            display: none;
            position: absolute;
            top: 54px;
            right: 0;
            width: 360px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            z-index: 100;
            overflow: hidden;
        }

        .notification-panel.open { display: block; }

        .panel-header {
            background-color: #2c3e50;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }

        .panel-header a {
            color: #aed6f1;
            font-size: 12px;
            text-decoration: none;
        }

        .panel-header a:hover { text-decoration: underline; }

        .panel-empty {
            padding: 24px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }

        .panel-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .panel-item:last-child { border-bottom: none; }

        .panel-item-left { flex: 1; }

        .panel-item-msg { font-size: 13px; color: #333; line-height: 1.4; }

        .panel-item-time { font-size: 11px; color: #aaa; margin-top: 3px; }

        .panel-badge {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            margin-right: 4px;
        }

        .panel-badge-DELAYED { background-color: #e74c3c; }
        .panel-badge-WARNING { background-color: #f39c12; }

        .panel-footer {
            padding: 10px 16px;
            text-align: center;
            border-top: 1px solid #eee;
        }

        .panel-footer a {
            font-size: 13px;
            color: #3498db;
            text-decoration: none;
        }

        /* ── 본문 ── */
        .content { padding: 30px; }

        h2 { margin-bottom: 12px; font-size: 17px; }

        /* ── KPI 카드 ── */
        .kpi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .total   { background-color: #4a90e2; }
        .delay   { background-color: #e74c3c; }
        .warning { background-color: #f39c12; }
        .normal  { background-color: #27ae60; }

        /* ── 주문 테이블 ── */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        th { background-color: #2c3e50; color: white; }

        .risk-DELAYED { color: #e74c3c; font-weight: bold; }
        .risk-WARNING { color: #f39c12; font-weight: bold; }
        .risk-NORMAL  { color: #27ae60; font-weight: bold; }

        a.row-link { color: #3498db; text-decoration: none; font-weight: bold; }
        a.row-link:hover { text-decoration: underline; }

        button {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-update  { background-color: #3498db; color: white; }
        .btn-receive { background-color: #2ecc71; color: white; }
        .btn-receive:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<!-- ── 상단 헤더 ── -->
<div class="top-bar">
    <h1>📊 납기 모니터링 대시보드</h1>

    <div class="nav-links">
        <!-- 페이지 네비게이션 -->
        <a href="/vendors">🏭 협력사</a>
        <a href="/report">📋 리포트</a>
        <a href="/notifications">🔔 알림</a>

        <!-- 알림 벨 (드롭다운) -->
        <div style="position: relative;">
            <div class="bell-wrapper" onclick="togglePanel()">
                <span class="bell-icon">🔔</span>
                <span class="bell-badge"
                      th:if="${unreadCount > 0}"
                      th:text="${unreadCount > 99} ? '99+' : ${unreadCount}">
                </span>
            </div>

            <!-- 알림 드롭다운 패널 -->
            <div id="notificationPanel" class="notification-panel">
                <div class="panel-header">
                    <span>🔔 미읽은 알림
                        <span th:if="${unreadCount > 0}" th:text="'(' + ${unreadCount} + '건)'"></span>
                    </span>
                    <a href="/notifications">전체 보기</a>
                </div>

                <div class="panel-empty" th:if="${#lists.isEmpty(unreadNotifications)}">
                    새로운 알림이 없습니다 🎉
                </div>

                <div th:each="n : ${unreadNotifications}" class="panel-item">
                    <div class="panel-item-left">
                        <div class="panel-item-msg">
                            <span class="panel-badge"
                                  th:classappend="'panel-badge-' + ${n.notificationType}"
                                  th:text="${n.notificationTypeDescription}">
                            </span>
                            <span th:text="${n.message}"></span>
                        </div>
                        <div class="panel-item-time"
                             th:text="${#temporals.format(n.notifiedAt, 'MM-dd HH:mm')}">
                        </div>
                    </div>
                    <a th:href="@{/dashboard/{id}(id=${n.orderId})}"
                       style="font-size:12px; color:#3498db; white-space:nowrap; text-decoration:none;">
                        보기 →
                    </a>
                </div>

                <div class="panel-footer" th:if="${!#lists.isEmpty(unreadNotifications)}">
                    <form action="/notifications/read-all" method="post" style="display:inline;">
                        <button type="submit"
                                style="background:none; border:none; color:#3498db; cursor:pointer; font-size:13px;">
                            ✅ 모두 읽음 처리
                        </button>
                    </form>
                    &nbsp;|&nbsp;
                    <a href="/notifications">전체 알림 보기</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ── 본문 ── -->
<div class="content">

    <!-- 엑셀 업로드 -->
    <h2>📥 엑셀 업로드</h2>
    <form method="post" enctype="multipart/form-data" action="/upload" style="margin-bottom: 30px;">
        <input type="file" name="file" accept=".xls,.xlsx" required>
        <button type="submit" class="btn-update">업로드</button>
    </form>

    <!-- KPI 카드 -->
    <div class="kpi-container">
        <div class="card total">
            총 주문<br>
            <span th:text="${dashboard.totalCount}"></span>
        </div>
        <div class="card delay">
            🔴 지연<br>
            <span th:text="${dashboard.delayCount}"></span>
        </div>
        <div class="card warning">
            🟠 위험<br>
            <span th:text="${dashboard.warningCount}"></span>
        </div>
        <div class="card normal">
            🟢 정상<br>
            <span th:text="${dashboard.normalCount}"></span>
        </div>
    </div>

    <!-- 주문 테이블 -->
    <table>
        <thead>
        <tr>
            <th>주문번호</th>
            <th>품목</th>
            <th>업체</th>
            <th>발주일</th>
            <th>납기일</th>
            <th>진행 상태</th>
            <th>위험 상태</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${dashboard.orders}">
            <td>
                <a class="row-link"
                   th:href="@{/dashboard/{id}(id=${order.id})}"
                   th:text="${order.poNumber}">
                </a>
            </td>
            <td th:text="${order.item}"></td>
            <td th:text="${order.vendor}"></td>
            <td th:text="${order.orderDate} ?: '-'"></td>
            <td th:text="${order.dueDate} ?: '-'"></td>
            <td th:text="${order.progressStatusDescription}"></td>
            <td th:text="${order.riskStatusDescription}"
                th:classappend="'risk-' + ${order.riskStatus}">
            </td>
            <td>
                <form th:action="@{/dashboard/{id}/status(id=${order.id})}" method="post" style="display:inline;">
                    <select name="status">
                        <option value="NOT_STARTED" th:selected="${order.progressStatus.name() == 'NOT_STARTED'}">미착수</option>
                        <option value="PROCESSING"  th:selected="${order.progressStatus.name() == 'PROCESSING'}">가공중</option>
                        <option value="COMPLETED"   th:selected="${order.progressStatus.name() == 'COMPLETED'}">완료</option>
                        <option value="RECEIVED"    th:selected="${order.progressStatus.name() == 'RECEIVED'}">입고</option>
                    </select>
                    <button class="btn-update" th:disabled="${order.received}">변경</button>
                </form>
                <form th:action="@{/dashboard/{id}/receive(id=${order.id})}" method="post" style="display:inline;">
                    <button class="btn-receive" th:disabled="${order.received}">입고완료</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<script>
    function togglePanel() {
        const panel = document.getElementById('notificationPanel');
        panel.classList.toggle('open');
    }

    document.addEventListener('click', function (e) {
        const wrapper = document.querySelector('.bell-wrapper');
        const panel = document.getElementById('notificationPanel');
        if (!wrapper.contains(e.target) && !panel.contains(e.target)) {
            panel.classList.remove('open');
        }
    });
</script>

</body>
</html>
