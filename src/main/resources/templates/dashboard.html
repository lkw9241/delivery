<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>납기 모니터링 대시보드</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f7f9fc;
        }

        h1 {
            margin-bottom: 20px;
        }

        .kpi-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            padding: 20px;
            border-radius: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .total { background-color: #4a90e2; }
        .delay { background-color: #e74c3c; }
        .normal { background-color: #27ae60; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

        .status-DELAYED {
            color: red;
            font-weight: bold;
        }

        .status-RISK {
            color: orange;
            font-weight: bold;
        }

        .status-NORMAL {
            color: green;
            font-weight: bold;
        }

        button {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-update { background-color: #3498db; color: white; }
        .btn-receive { background-color: #2ecc71; color: white; }

    </style>
</head>
<body>

<h1>📊 납기 모니터링 대시보드</h1>

<h2>📥 엑셀 업로드</h2>

<form method="post" enctype="multipart/form-data" action="/upload">
    <input type="file" name="file" required>
    <button type="submit">업로드</button>
</form>

<br>

<!-- KPI 카드 -->
<div class="kpi-container">
    <div class="card total">
        총 주문<br>
        <span th:text="${totalCount}"></span>
    </div>

    <div class="card delay">
        🔴 지연<br>
        <span th:text="${delayCount}"></span>
    </div>

    <div class="card normal">
        🟢 정상<br>
        <span th:text="${totalCount - delayCount}"></span>
    </div>
</div>

<!-- 주문 테이블 -->
<table>
    <thead>
    <tr>
        <th>주문번호</th>
        <th>품목</th>
        <th>업체</th>
        <th>납기일</th>
        <th>상태</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.poNumber}"></td>
        <td th:text="${order.item}"></td>
        <td th:text="${order.vendor}"></td>
        <td th:text="${order.dueDate}"></td>

        <td th:text="${order.progressStatus}"
            th:classappend="'status-' + ${order.progressStatus}">
        </td>

        <td>
            <!-- 상태 변경 -->
            <form th:action="@{/dashboard/{id}/status(id=${order.id})}" method="post" style="display:inline;">
                <select name="status">
                    <option value="NORMAL">정상</option>
                    <option value="RISK">위험</option>
                    <option value="DELAYED">지연</option>
                </select>
                <button class="btn-update">변경</button>
            </form>

            <!-- 입고 처리 -->
            <form th:action="@{/dashboard/{id}/receive(id=${order.id})}" method="post" style="display:inline;">
                <button class="btn-receive">입고완료</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
