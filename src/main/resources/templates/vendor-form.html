<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${vendor != null} ? '협력사 수정' : '협력사 등록'">협력사 등록/수정</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f7f9fc; padding: 30px; }
        h1 { margin-bottom: 24px; font-size: 22px; }

        .form-card {
            background: white; border-radius: 10px;
            padding: 30px; max-width: 480px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; color: #555; margin-bottom: 6px; font-size: 14px; }
        input[type="text"], input[type="email"], textarea {
            width: 100%; padding: 9px 12px; border: 1px solid #ccc;
            border-radius: 6px; font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none; border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52,152,219,0.2);
        }
        textarea { resize: vertical; min-height: 80px; }

        .required { color: #e74c3c; margin-left: 2px; }

        .actions { display: flex; gap: 10px; margin-top: 24px; }
        button, .btn {
            padding: 10px 20px; border: none; border-radius: 6px;
            cursor: pointer; font-size: 14px; text-decoration: none;
            display: inline-block;
        }
        .btn-submit { background-color: #3498db; color: white; }
        .btn-back   { background-color: #95a5a6; color: white; }
    </style>
</head>
<body>

<h1 th:text="${vendor != null} ? '🏭 협력사 수정' : '🏭 협력사 등록'"></h1>

<div class="form-card">
    <!-- 등록: POST /vendors  |  수정: POST /vendors/{id}/edit -->
    <form th:action="${vendor != null} ? @{/vendors/{id}/edit(id=${vendor.id})} : @{/vendors}"
          method="post">

        <div class="form-group">
            <label>협력사명 <span class="required">*</span></label>
            <input type="text" name="name"
                   th:value="${vendor?.name}"
                   th:readonly="${vendor != null}"
                   placeholder="협력사명을 입력하세요" required>
        </div>

        <div class="form-group">
            <label>담당자명</label>
            <input type="text" name="contactName"
                   th:value="${vendor?.contactName}"
                   placeholder="담당자 이름">
        </div>

        <div class="form-group">
            <label>연락처</label>
            <input type="text" name="phone"
                   th:value="${vendor?.phone}"
                   placeholder="010-0000-0000">
        </div>

        <div class="form-group">
            <label>이메일</label>
            <input type="email" name="email"
                   th:value="${vendor?.email}"
                   placeholder="example@company.com">
        </div>

        <div class="form-group">
            <label>비고</label>
            <textarea name="note" placeholder="추가 정보를 입력하세요"
                      th:text="${vendor?.note}"></textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn-submit"
                    th:text="${vendor != null} ? '수정 완료' : '등록'">등록</button>
            <a th:href="${vendor != null} ? @{/vendors/{id}(id=${vendor.id})} : '/vendors'"
               class="btn btn-back">취소</a>
        </div>
    </form>
</div>

</body>
</html>
