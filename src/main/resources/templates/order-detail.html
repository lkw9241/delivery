<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>발주 상세</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f7f9fc;
        }

        h1 { margin-bottom: 24px; }

        .detail-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .detail-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            width: 130px;
            font-weight: bold;
            color: #555;
            flex-shrink: 0;
        }

        .detail-value { color: #222; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            color: white;
        }

        .badge-DELAYED { background-color: #e74c3c; }
        .badge-WARNING { background-color: #f39c12; }
        .badge-NORMAL  { background-color: #27ae60; }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-update  { background-color: #3498db; color: white; }
        .btn-receive { background-color: #2ecc71; color: white; }
        .btn-back    { background-color: #95a5a6; color: white; text-decoration: none;
                       padding: 8px 16px; border-radius: 6px; font-size: 14px; }

        .btn-receive:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<h1>📦 발주 상세</h1>

<div class="detail-card">

    <div class="detail-row">
        <span class="detail-label">주문번호 (PO)</span>
        <span class="detail-value" th:text="${order.poNumber}"></span>
    </div>
    <div class="detail-row">
        <span class="detail-label">품목명</span>
        <span class="detail-value" th:text="${order.item}"></span>
    </div>
    <div class="detail-row">
        <span class="detail-label">협력사</span>
        <span class="detail-value" th:text="${order.vendor}"></span>
    </div>
    <div class="detail-row">
        <span class="detail-label">발주일</span>
        <span class="detail-value" th:text="${order.orderDate} ?: '-'"></span>
    </div>
    <div class="detail-row">
        <span class="detail-label">납기일</span>
        <span class="detail-value" th:text="${order.dueDate} ?: '-'"></span>
    </div>
    <div class="detail-row">
        <span class="detail-label">진행 상태</span>
        <span class="detail-value" th:text="${order.progressStatusDescription}"></span>
    </div>
    <div class="detail-row">
        <span class="detail-label">위험 상태</span>
        <span class="detail-value">
            <span class="badge"
                  th:classappend="'badge-' + ${order.riskStatus}"
                  th:text="${order.riskStatusDescription}">
            </span>
        </span>
    </div>
    <div class="detail-row">
        <span class="detail-label">입고 여부</span>
        <span class="detail-value" th:text="${order.received} ? '✅ 입고 완료' : '⏳ 미입고'"></span>
    </div>

</div>

<!-- 액션 버튼 -->
<div class="actions">

    <!-- 진행 상태 변경 -->
    <form th:action="@{/dashboard/{id}/status(id=${order.id})}" method="post" style="display:inline-flex; gap:8px; align-items:center;">
        <select name="status">
            <option value="NOT_STARTED"  th:selected="${order.progressStatus.name() == 'NOT_STARTED'}">미착수</option>
            <option value="PROCESSING"   th:selected="${order.progressStatus.name() == 'PROCESSING'}">가공중</option>
            <option value="COMPLETED"    th:selected="${order.progressStatus.name() == 'COMPLETED'}">완료</option>
            <option value="RECEIVED"     th:selected="${order.progressStatus.name() == 'RECEIVED'}">입고</option>
        </select>
        <button class="btn-update" th:disabled="${order.received}">상태 변경</button>
    </form>

    <!-- 입고 완료 처리 -->
    <form th:action="@{/dashboard/{id}/receive(id=${order.id})}" method="post" style="display:inline;">
        <button class="btn-receive" th:disabled="${order.received}">입고 완료</button>
    </form>

    <!-- 대시보드로 돌아가기 -->
    <a href="/dashboard" class="btn-back">← 대시보드</a>

</div>

</body>
</html>
